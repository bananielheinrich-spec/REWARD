<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Rewards</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #050507;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Eleganter, unaufdringlicher Hintergrund-Canvas */
        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ultra-Clean Card Design */
        .container {
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 2;
            transition: border-color 0.4s ease, transform 0.4s ease;
        }

        .container:hover {
            border-color: rgba(0, 162, 255, 0.2);
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #71717a;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        /* Minimalistisches Input-Feld */
        input {
            width: 100%;
            padding: 14px 16px;
            margin-top: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: rgba(0, 162, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.1);
        }

        input::placeholder {
            color: #42424a;
        }

        /* Cleaner, flacher Button */
        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #050507;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #e4e4e7;
            transform: scale(1.01);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Status Text */
        #status {
            margin-top: 20px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #a1a1aa;
            min-height: 22px; /* Verhindert das Ruckeln der Box bei Textänderung */
        }
    </style>
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="container">
    <h1>Live Reward</h1>
    <p class="subtitle">Gib deinen Namen ein. Du erhältst alle 24h automatisch <span style="color: #00a2ff; font-weight: 500;">1.000 Wins</span> im Spiel.</p>

    <input type="text" id="username" placeholder="Roblox Name" autocomplete="off">
    <button onclick="claimReward()">Wins anfordern</button>

    <p id="status"></p>
</div>

<script>
// ==========================================
// ELEGANTER, CLEANER MAUS-SCHWEIF (PARTIKEL)
// ==========================================
const canvas = document.getElementById("effect-canvas");
const ctx = canvas.getContext("2d");

let particles = [];
const mouse = { x: null, y: null };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    
    // Ganz dezenter Spawneffekt (nur 1 edler Partikel pro Bewegung)
    if (Math.random() > 0.4) {
        particles.push(new Particle(mouse.x, mouse.y));
    }
});

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        // Sanftere, leicht unterschiedliche Größen
        this.size = Math.random() * 2 + 0.5;
        // Trägere, fließende Bewegung
        this.speedX = Math.random() * 0.8 - 0.4;
        this.speedY = Math.random() * 0.8 - 0.4;
        // Ein sehr edles, dezentes Hellblau/Weiß-Glühen
        this.color = "rgba(165, 215, 255, ";
        this.alpha = 0.6;
        this.decay = Math.random() * 0.008 + 0.004; // Verblassen sehr langsam und edel
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.fillStyle = this.color + this.alpha + ")";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
            i--;
        }
    }
    requestAnimationFrame(animate);
}
animate();

// ==========================================
// CLAIM LOGIK
// ==========================================
async function claimReward() {
    const username = document.getElementById("username").value.trim();
    const status = document.getElementById("status");

    if (!username) {
        status.innerHTML = "<span style='color: #ef4444;'>Bitte Namen eingeben.</span>";
        return;
    }

    status.innerHTML = "Prüfe...";

    try {
        const res = await fetch("https://roblox-reward.onrender.com/create-claim", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username })
        });

        const data = await res.json();

        if (data.success) {
            status.innerHTML = `
                <span style="color: #10b981; font-weight: 500;">✔ Erfolgreich aktiviert</span><br>
                <span style="color: #71717a; font-size: 0.8rem;">Schau jetzt live in dein Spiel!</span>
            `;
        } else {
            // Fehlermeldung vom Server (z.B. Cooldown) anzeigen
            status.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
        }
    } catch (error) {
        status.innerHTML = "<span style='color: #ef4444;'>Server nicht erreichbar.</span>";
        console.error(error);
    }
}
</script>

</body>
</html>
