<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Rewards</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #06060a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Interaktiver Wallpaper Engine Hintergrund */
        #effect-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ultra-Clean Card Design */
        .container {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 2;
            transition: border-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .container:hover {
            border-color: rgba(0, 162, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 20px 50px rgba(0, 162, 255, 0.05);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #71717a;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        /* Minimalistisches Input-Feld */
        input {
            width: 100%;
            padding: 14px 16px;
            margin-top: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: rgba(0, 162, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.08);
        }

        input::placeholder {
            color: #42424a;
        }

        input:disabled {
            background: rgba(255, 255, 255, 0.01);
            border-color: rgba(255, 255, 255, 0.03);
            color: #52525b;
            cursor: not-allowed;
        }

        /* Cleaner, flacher Button */
        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #050507;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #e4e4e7;
            transform: scale(1.01);
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: #71717a;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Status & Timer Text */
        #status {
            margin-top: 20px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #a1a1aa;
        }

        .timer-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 8px;
            color: #f87171;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="container">
    <h1>Live Reward</h1>
    <p class="subtitle">Gib deinen Namen ein. Du erhältst alle 24h automatisch <span style="color: #00a2ff; font-weight: 500;">1.000 Wins</span> im Spiel.</p>

    <input type="text" id="username" placeholder="Roblox Name" autocomplete="off">
    <button id="claim-btn" onclick="claimReward()">Wins anfordern</button>

    <div id="timer-display" class="timer-box"></div>
    <p id="status"></p>
</div>

<script>
// ==========================================
// WALLPAPER ENGINE PARTIKEL-SYSTEM (INTERAKTIV)
// ==========================================
const canvas = document.getElementById("effect-canvas");
const ctx = canvas.getContext("2d");

let particles = [];
const mouse = { x: null, y: null, radius: 120 };

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initWallpaperParticles();
}
window.addEventListener("resize", resizeCanvas);

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("mouseleave", () => {
    mouse.x = null;
    mouse.y = null;
});

class WallpaperParticle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseSize = Math.random() * 1.5 + 0.5;
        this.size = this.baseSize;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.color = "rgba(0, 162, 255, "; // Deine Wunschfarbe (Dezentes Hellblau)
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // Bildschirmränder abprallen
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        // Maus-Interaktion (Repulsion / Wegdrücken)
        if (mouse.x != null && mouse.y != null) {
            let dx = this.x - mouse.x;
            let dy = this.y - mouse.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < mouse.radius) {
                let force = (mouse.radius - distance) / mouse.radius;
                this.x += (dx / distance) * force * 2;
                this.y += (dy / distance) * force * 2;
                this.size = this.baseSize * 1.5;
            } else {
                if (this.size > this.baseSize) this.size -= 0.05;
            }
        }
    }

    draw() {
        ctx.fillStyle = this.color + "0.4)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initWallpaperParticles() {
    particles = [];
    // Partikelanzahl skaliert mit der Bildschirmgröße
    let numberOfParticles = (canvas.width * canvas.height) / 9000;
    for (let i = 0; i < numberOfParticles; i++) {
        particles.push(new WallpaperParticle());
    }
}

function drawLines() {
    for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
            let dx = particles[a].x - particles[b].x;
            let dy = particles[a].y - particles[b].y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            // Verbinde nahe beieinander liegende Partikel
            if (distance < 100) {
                let alpha = (100 - distance) / 100 * 0.06;
                ctx.strokeStyle = `rgba(0, 162, 255, ${alpha})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
        p.update();
        p.draw();
    }
    drawLines();
    requestAnimationFrame(animate);
}

// Start der Effekte
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
initWallpaperParticles();
animate();


// ==========================================
// DAUERHAFTER PERSISTENTER TIMER & CLAIM LOGIK
// ==========================================
const inputField = document.getElementById("username");
const claimBtn = document.getElementById("claim-btn");
const timerDisplay = document.getElementById("timer-display");
const status = document.getElementById("status");

let countdownInterval;

// Prüfen, ob noch ein aktiver Timer im Speicher liegt
window.addEventListener("load", checkActiveCooldown);

function checkActiveCooldown() {
    const unlockTime = localStorage.getItem("claimUnlockTime");
    if (unlockTime) {
        const timeLeft = unlockTime - Date.now();
        if (timeLeft > 0) {
            // Timer läuft noch -> UI sperren und Timer anzeigen
            startTimer(timeLeft);
        } else {
            // Abgelaufen -> Speicher löschen
            localStorage.removeItem("claimUnlockTime");
        }
    }
}

function startTimer(duration) {
    inputField.disabled = true;
    claimBtn.disabled = true;
    timerDisplay.style.display = "block";
    status.innerHTML = "<span style='color: #71717a;'>Du hast deine Belohnung heute bereits geholt.</span>";

    function updateDisplay() {
        const now = Date.now();
        const unlockTime = localStorage.getItem("claimUnlockTime");
        const diff = unlockTime - now;

        if (diff <= 0) {
            clearInterval(countdownInterval);
            localStorage.removeItem("claimUnlockTime");
            inputField.disabled = false;
            claimBtn.disabled = false;
            timerDisplay.style.display = "none";
            status.innerHTML = "";
            return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        timerDisplay.innerHTML = `⏱ Sperre aktiv: ${hours}g ${minutes}m ${seconds}s`;
    }

    updateDisplay();
    countdownInterval = setInterval(updateDisplay, 1000);
}

async function claimReward() {
    const username = inputField.value.trim();

    if (!username) {
        status.innerHTML = "<span style='color: #ef4444;'>Bitte Namen eingeben.</span>";
        return;
    }

    status.innerHTML = "Prüfe...";

    try {
        const res = await fetch("https://roblox-reward.onrender.com/create-claim", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username })
        });

        const data = await res.json();

        if (data.success) {
            status.innerHTML = `
                <span style="color: #10b981; font-weight: 500;">✔ Erfolgreich aktiviert</span><br>
                <span style="color: #71717a; font-size: 0.8rem;">Schau jetzt live in dein Spiel!</span>
            `;
            
            // 24 Stunden Cooldown berechnen und lokal im Browser sichern
            const cooldownExpiry = Date.now() + (24 * 60 * 60 * 1000);
            localStorage.setItem("claimUnlockTime", cooldownExpiry);
            
            // Timer sofort starten
            startTimer(24 * 60 * 60 * 1000);
        } else {
            status.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            
            // Falls der Webserver sagt, man hat noch Cooldown, wir aber lokal keinen Timer hatten (z.B. Cookies gelöscht)
            if (data.error.includes("Warte noch")) {
                // Extrahiere grob die Stunden aus der Servermeldung und setze zur Sicherheit einen lokalen Timer
                const match = data.error.match(/\d+/);
                if (match) {
                    const hoursLeft = parseInt(match[0]);
                    const cooldownExpiry = Date.now() + (hoursLeft * 60 * 60 * 1000);
                    localStorage.setItem("claimUnlockTime", cooldownExpiry);
                    startTimer(hoursLeft * 60 * 60 * 1000);
                }
            }
        }
    } catch (error) {
        status.innerHTML = "<span style='color: #ef4444;'>Server nicht erreichbar.</span>";
        console.error(error);
    }
}
</script>

</body>
</html>
