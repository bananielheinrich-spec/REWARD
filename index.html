<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Animation Parser & Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --button-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .input-section, .output-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        .category-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .category-title {
            color: var(--accent-color);
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .stage-title {
            color: #34d399;
            font-size: 15px;
            margin: 10px 0 5px 0;
        }

        .anim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .anim-item {
            background-color: var(--card-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .anim-name {
            font-weight: bold;
            color: #cbd5e1;
            font-size: 13px;
        }

        .anim-id {
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lua Animation Viewer</h1>
        <p class="subtitle">Füge deine riesige Lua-Tabelle ein, um sie übersichtlich anzuzeigen und herunterzuladen.</p>

        <div class="input-section">
            <label for="luaInput"><strong>Lua-Tabelle hier einfügen:</strong></label>
            <textarea id="luaInput" placeholder="Füge hier deine Tabelle ein..."></textarea>
            <div class="actions">
                <button onclick="parseLuaTable()">Tabelle analysieren</button>
                <button onclick="downloadFile()" style="background-color: #10b981; color: white;">Als JSON herunterladen</button>
            </div>
        </div>

        <div class="output-section">
            <h3 style="margin-top: 0;">Übersicht & Vorschau:</h3>
            <div id="resultsContainer">
                <p style="color: #64748b;">Noch keine Daten geladen. Füge oben deine Tabelle ein und klicke auf "Tabelle analysieren".</p>
            </div>
        </div>
    </div>

    <script>
        let parsedData = {};

        function parseLuaTable() {
            const rawText = document.getElementById('luaInput').value;
            parsedData = {};
            
            const lines = rawText.split('\n');
            let currentAnimal = '';
            let currentStage = '';

            for (let line of lines) {
                let trimmed = line.trim();

                // Erkennst Tier-Namen (z.B. "Pig = {" oder "Bunny = {")
                let animalMatch = trimmed.match(/^([a-zA-Z0-9_]+)\s*=\s*\{/);
                if (animalMatch && !['Baby', 'Teen', 'Adult'].includes(animalMatch[1])) {
                    currentAnimal = animalMatch[1];
                    parsedData[currentAnimal] = {};
                    continue;
                }

                // Erkennt Lebensphasen (z.B. "Baby = {")
                let stageMatch = trimmed.match(/^(Baby|Teen|Adult)\s*=\s*\{/i);
                if (stageMatch && currentAnimal) {
                    currentStage = stageMatch[1];
                    parsedData[currentAnimal][currentStage] = {};
                    continue;
                }

                // Erkennt Animations-Einträge (z.B. Walk = "rbxassetid://...")
                let entryMatch = trimmed.match(/^([a-zA-Z0-9_]+)\s*=\s*["']([^"']+)["']/);
                if (entryMatch && currentAnimal && currentStage) {
                    let animType = entryMatch[1];
                    let animId = entryMatch[2];
                    parsedData[currentAnimal][currentStage][animType] = animId;
                }
            }

            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const animals = Object.keys(parsedData);
            if (animals.length === 0) {
                container.innerHTML = '<p style="color: #ef4444;">Fehler: Konnte keine Struktur erkennen. Bitte überprüfe dein Format.</p>';
                return;
            }

            animals.forEach(animal => {
                const catCard = document.createElement('div');
                catCard.className = 'category-card';

                const catTitle = document.createElement('h4');
                catTitle.className = 'category-title';
                catTitle.textContent = animal;
                catCard.appendChild(catTitle);

                const stages = Object.keys(parsedData[animal]);
                stages.forEach(stage => {
                    const stageTitle = document.createElement('div');
                    stageTitle.className = 'stage-title';
                    stageTitle.textContent = '• ' + stage;
                    catCard.appendChild(stageTitle);

                    const grid = document.createElement('div');
                    grid.className = 'anim-grid';

                    const anims = parsedData[animal][stage];
                    Object.keys(anims).forEach(animName => {
                        const animItem = document.createElement('div');
                        animItem.className = 'anim-item';

                        const nameEl = document.createElement('div');
                        nameEl.className = 'anim-name';
                        nameEl.textContent = animName;

                        const idEl = document.createElement('div');
                        idEl.className = 'anim-id';
                        idEl.textContent = anims[animName];

                        animItem.appendChild(nameEl);
                        animItem.appendChild(idEl);
                        grid.appendChild(animItem);
                    });

                    catCard.appendChild(grid);
                });

                container.appendChild(catCard);
            });
        }

        function downloadFile() {
            if (Object.keys(parsedData).length === 0) {
                alert('Bitte analysiere zuerst eine Tabelle!');
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsedData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "animation_ids.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
