<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Animation Parser & Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --button-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .input-section, .output-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        .category-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .category-title {
            color: var(--accent-color);
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .anim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .anim-item {
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .anim-name {
            font-weight: bold;
            color: #cbd5e1;
            font-size: 14px;
        }

        .anim-id {
            font-family: monospace;
            color: #38bdf8;
            font-size: 12px;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lua Animation Viewer</h1>
        <p class="subtitle">Füge deine langen Lua-Tabellen ein, um sie übersichtlich zu sortieren und als Datei herunterzuladen.</p>

        <div class="input-section">
            <label for="luaInput"><strong>Lua-Tabelle hier einfügen:</strong></label>
            <textarea id="luaInput" placeholder="Bunny = {
    Baby = {
        Walk = &quot;rbxassetid://...&quot;,
        Idle = &quot;rbxassetid://...&quot;
    }
}"></textarea>
            <div class="actions">
                <button onclick="parseLuaTable()">Tabelle analysieren</button>
                <button onclick="downloadFile()" style="background-color: #10b981; color: white;">Als Datei herunterladen</button>
            </div>
        </div>

        <div class="output-section">
            <h3 style="margin-top: 0;">Übersicht & Vorschau:</h3>
            <div id="resultsContainer">
                <p style="color: #64748b;">Noch keine Daten geladen. Füge oben eine Tabelle ein und klicke auf "Tabelle analysieren".</p>
            </div>
        </div>
    </div>

    <script>
        let parsedData = {};

        function parseLuaTable() {
            const rawText = document.getElementById('luaInput').value;
            parsedData = {};
            
            // Einfacher Parser für Lua-Tabellen im Format: Key = { SubKey = "Value", ... }
            // Entfernt Zuweisungen am Anfang wie "Bunny =" falls vorhanden
            let cleaned = rawText.replace(/^[a-zA-Z0-9_]+\s*=\s*/, '');
            
            // Da das Parsen von komplett echtem Lua im Browser ohne externe Bibliotheken komplex ist,
            // nutzen wir ein robustes RegEx-Muster, um Blöcke und Schlüssel-Wert-Paare zu finden.
            
            // Wir suchen nach Hauptkategorien (z.B. Baby = { ... })
            const categoryRegex = /([a-zA-Z0-9_]+)\s*=\s*\{([^}]*)\}/g;
            let match;

            while ((match = categoryRegex.exec(cleaned)) !== null) {
                const catName = match.1;
                const catContent = match.2;
                parsedData[catName] = {};

                // Suche nach Untereinträgen (z.B. Walk = "rbxassetid://...")
                const itemRegex = /([a-zA-Z0-9_]+)\s*=\s*["']([^"']+)["']/g;
                let itemMatch;
                while ((itemMatch = itemRegex.exec(catContent)) !== null) {
                    const itemName = itemMatch.1;
                    const itemValue = itemMatch.2;
                    parsedData[catName][itemName] = itemValue;
                }
            }

            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const categories = Object.keys(parsedData);
            if (categories.length === 0) {
                container.innerHTML = '<p style="color: #ef4444;">Fehler: Konnte keine Struktur erkennen. Überprüfe das Format deiner Lua-Tabelle.</p>';
                return;
            }

            categories.forEach(cat => {
                const catCard = document.createElement('div');
                catCard.className = 'category-card';

                const catTitle = document.createElement('h4');
                catTitle.className = 'category-title';
                catTitle.textContent = cat;
                catCard.appendChild(catTitle);

                const grid = document.createElement('div');
                grid.className = 'anim-grid';

                const items = parsedData[cat];
                Object.keys(items).forEach(itemName => {
                    const animItem = document.createElement('div');
                    animItem.className = 'anim-item';

                    const nameEl = document.createElement('div');
                    nameEl.className = 'anim-name';
                    nameEl.textContent = itemName;

                    const idEl = document.createElement('div');
                    idEl.className = 'anim-id';
                    idEl.textContent = items[itemName];

                    animItem.appendChild(nameEl);
                    animItem.appendChild(idEl);
                    grid.appendChild(animItem);
                });

                catCard.appendChild(grid);
                container.appendChild(catCard);
            });
        }

        function downloadFile() {
            if (Object.keys(parsedData).length === 0) {
                alert('Bitte erstelle zuerst eine gültige Analyse!');
                return;
            }

            // Erstelle eine saubere JSON-Datei (kann auch als .txt gespeichert werden)
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsedData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "animation_ids.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
