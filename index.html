<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reward Claim</title>

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:#1c1c1c;
    padding:25px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input {
    width:100%;
    padding:10px;
    margin-top:10px;
}

button {
    margin-top:10px;
    padding:10px;
    width:100%;
    background:#00a2ff;
    border:none;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
    <h2>Daily Reward</h2>

    <input id="username" placeholder="Roblox Username">

    <button onclick="claim()">CLAIM</button>

    <p id="status"></p>
</div>

<script>
async function claim() {
    const username = document.getElementById("username").value;
    const status = document.getElementById("status");

    if (!username) {
        status.innerText = "Bitte Username eingeben!";
        return;
    }

    status.innerText = "Wird verarbeitet...";

    const res = await fetch("http://localhost:3000/claim", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username })
    });

    const data = await res.json();

    status.innerText = data.message;
}
</script>

</body>
</html>
